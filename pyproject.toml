[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cove-book-forge-mcp"
version = "0.1.0.dev0"
description = "Local-first book analysis, persistent whole-book Skill forging, and MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "defusedxml>=0.7,<1",
  "httpx>=0.28,<1",
  "mcp>=1.26,<2",
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "pypdf>=5,<7",
  "PyYAML>=6.0,<7",
  "typer>=0.16,<1",
]

[project.scripts]
cove-book-forge = "cove_book_forge.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cove_book_forge"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/examples",
  "/pyproject.toml",
  "/uv.lock",
  "/README.md",
  "/LICENSE",
  "/ACKNOWLEDGEMENTS.md",
  "/THIRD_PARTY_NOTICES.md",
  "/CHANGELOG.md",
]
exclude = [
  "/.coverage*",
  "/.env*",
  "/.git",
  "/.mypy_cache",
  "/.nox",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.superpowers",
  "/.tox",
  "/.venv",
  "/.worktrees",
  "/build",
  "/config.yaml",
  "/data",
  "/dist",
  "/generated-skills",
  "/htmlcov",
  "/imports",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cove_book_forge"]

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "starlette", "starlette.*"]
follow_imports = "skip"
ignore_missing_imports = true
